.pro-banner{border:1px solid #c8d8ff;background:linear-gradient(135deg,#f7f9ff,#eef4ff);border-radius:18px;padding:13px 14px;margin-bottom:12px}
.pro-banner .pro-line{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pro-badge{display:inline-flex;align-items:center;gap:6px;background:#e8efff;color:var(--primary);border:1px solid #c9d8ff;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:900}
.dashboard-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}

.dashboard-stat small{display:block;color:var(--muted);font-size:9px;margin-top:8px}

.developer-credit{margin-top:9px;text-align:center;color:var(--muted);font-size:9px;line-height:1.8} .transfer-badge{display:inline-flex;align-items:center;gap:6px;background:#eef4ff;color:var(--primary);border:1px solid #c8d8ff;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:900}.transfer-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.transfer-actions .btn{width:100%}.page-enter{animation:pageIn 260ms cubic-bezier(.2,.75,.2,1)}
.overlay{animation:overlayIn 180ms ease-out}.sheet{animation:sheetIn 280ms cubic-bezier(.2,.8,.2,1)}

@keyframes overlayIn{from{opacity:0}to{opacity:1}}

.btn,.icon-btn,.menu-item,.quick,.tab,.switch{transition:transform 160ms cubic-bezier(.2,.8,.2,1),box-shadow 180ms ease,background 180ms ease,border-color 180ms ease}
.btn:active,.icon-btn:active,.menu-item:active,.quick:active,.tab:active{transform:scale(.96)}

<body>
<div class="app-shell" id="app">
<header class="topbar" id="topbar">
  <div class="brand"><img id="appBrandLogoV2" class="brand-logo-v2" src="original_logo.png" alt="لوگوی Beaching"><div><div class="brand-title">بچینگ آجر سیلیکان</div><div class="brand-sub">گزارش و ثبت عملیات شیفت</div></div></div>
  <div class="top-actions"><button class="icon-btn" id="topPdf" aria-label="PDF"></button><button class="icon-btn" id="topMenu" aria-label="منو"></button></div>
</header>
<main class="main" id="main"></main>
<nav class="bottom-nav" id="bottomNav"></nav>
</div>
<div class="toast" id="toast"></div>
<div class="loading" id="loading"><div class="loading-card"><div class="spinner"></div><b id="loadingTitle">در حال آماده‌سازی</b><span id="loadingSub">لطفاً چند لحظه صبر کنید...</span></div></div>
<script>
'use strict';

function hasUnconfirmedDraft(){

    db.shift || db.batches?.length || db.samples?.length || db.failures?.length ||

    db.handover?.giver?.confirmed || db.handover?.receiver?.confirmed || db.batchDraft
  ));

function save(){
  const payload=JSON.stringify(db);
  localStorage.setItem(KEY,payload);
  const verified=localStorage.getItem(KEY);

}

function renumberBatches(){(db.batches||[]).forEach((x,i)=>x.row=i+1);normalizeRanges()}
function batchTimeStep(){return Math.max(1,Math.min(180,Number(faDigits(db.batchTimeInterval))||6))}
function reflowBatchTimes(anchorIndex=0){const arr=db.batches||[];if(!arr.length)return;const step=batchTimeStep();let idx=Math.max(0,Math.min(arr.length-1,Number(anchorIndex)||0));let base=normalizeTime(arr[idx]?.time);if(!base){const next=arr.slice(idx+1).find(x=>normalizeTime(x.time));if(next){let ni=arr.indexOf(next);base=addMinutesToTime(next.time,-step*Math.max(1,ni-idx));idx=ni}else return}for(let i=idx;i<arr.length;i++)arr[i].time=i===idx?base:addMinutesToTime(arr[i-1].time,step)}
function insertBatchAt(position,b){const arr=db.batches||[],pos=Math.max(1,Math.min(arr.length+1,Number(position)||1));arr.splice(pos-1,0,b);renumberBatches()}
function moveBatchTo(row,target){const arr=db.batches||[],from=arr.findIndex(x=>Number(x.row)===Number(row));if(from<0)return false;const to=Math.max(1,Math.min(arr.length,Number(target)||1))-1;if(from===to)return true;const item=arr.splice(from,1)[0];arr.splice(to,0,item);const anchor=Math.min(from,to);reflowBatchTimes(anchor);renumberBatches();return true}

function normalizeRanges(){const n=db.batches.length;db.limeFormulaRanges=(db.limeFormulaRanges||[]).slice().sort((a,b)=>(+a.fromBatch||0)-((+b.fromBatch)||0));let end=0;for(const r of db.limeFormulaRanges){r.fromBatch=Math.max(1,+r.fromBatch||1);if(r.toBatch!==null&&r.toBatch!==undefined&&r.toBatch!=='')r.toBatch=Math.max(r.fromBatch,Math.min(n||+r.toBatch,+r.toBatch||r.fromBatch));else r.toBatch=null;if(r.fromBatch<=end)r.fromBatch=end+1;end=r.toBatch==null?Math.max(end,r.fromBatch-1):r.toBatch}}

function signatureHasInk(c){try{const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;for(let i=3;i<d.length;i+=4)if(d[i]>10&&(d[i-3]<248||d[i-2]<248||d[i-1]<248))return true}catch(e){}return false}
function openSignature(role){const p=db.handover?.[role]||{},title=role==='giver'?'اپراتور تحویل‌دهنده':'اپراتور تحویل‌گیرنده';const d=modal(title,`<div class="field"><label>نام اپراتور</label><input id="sigName" value="${esc(p.name||'')}" placeholder="نام اپراتور"></div><div class="field"><label>امضا</label><div class="signature"><canvas id="sigCanvas" width="900" height="360"></canvas><div class="signature-tools"><button class="btn btn-secondary" id="gallery">${icon('share',15)} انتخاب از گالری</button><button class="btn btn-secondary" id="clearSig">پاک کردن</button><input id="sigFile" type="file" accept="image/*"></div></div></div>`,`<button class="btn btn-secondary" id="cancel">انصراف</button><button class="btn btn-success" id="saveSig">${icon('check',16)} ثبت و تایید امضا</button>`);const c=d.querySelector('#sigCanvas'),ctx=c.getContext('2d');ctx.lineWidth=3.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#2463EB';let drawing=false,last=null,has=!!p.sig;function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}function paint(src){const im=new Image();im.onload=()=>{ctx.clearRect(0,0,c.width,c.height);const sc=Math.min(c.width/im.width,c.height/im.height),w=im.width*sc,h=im.height*sc;ctx.drawImage(im,(c.width-w)/2,(c.height-h)/2,w,h);has=true};im.src=src}if(p.sig)paint(p.sig);c.addEventListener('pointerdown',e=>{e.preventDefault();drawing=true;last=pos(e);c.setPointerCapture?.(e.pointerId);ctx.beginPath();ctx.moveTo(last.x,last.y);has=true},{passive:false});c.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const q=pos(e);ctx.quadraticCurveTo(last.x,last.y,(last.x+q.x)/2,(last.y+q.y)/2);ctx.stroke();last=q},{passive:false});const up=()=>drawing=false;c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);d.querySelector('#clearSig').onclick=()=>{ctx.clearRect(0,0,c.width,c.height);has=false};d.querySelector('#gallery').onclick=()=>d.querySelector('#sigFile').click();d.querySelector('#sigFile').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=()=>paint(rd.result);rd.readAsDataURL(f);e.target.value=''};d.querySelector('#cancel').onclick=()=>d.remove();d.querySelector('#saveSig').onclick=()=>{const name=d.querySelector('#sigName').value.trim();if(!name){toast('نام اپراتور را وارد کنید',false);return}if(!has||!signatureHasInk(c)){toast('لطفاً امضای اپراتور را وارد کنید یا از گالری انتخاب کنید',false);return}db.handover=db.handover||{};db.handover[role]={name,sig:c.toDataURL('image/png'),confirmed:true,date:today(),time:now(),updatedAt:Date.now()};syncHandoverHistory();persist();d.remove();showPage('handover');toast(title+' تایید و ثبت شد')}}
function syncHandoverHistory(){const id=db.__handoverCurrentId||'handover_current';db.__handoverCurrentId=id;const existing=(db.handoverHistory||[]).find(x=>x.id===id);const rec={id,shift:clone(db.shift||{}),giver:clone(db.handover?.giver||{}),receiver:clone(db.handover?.receiver||{}),updatedAt:Date.now()};if(existing){Object.assign(existing,rec)}else{db.handoverHistory=db.handoverHistory||[];db.handoverHistory.unshift(rec)}db.__handoverCurrentId=id}

function audit(){const sh=db.shift||{},a=db.activities||{},tools=a.tools||{};const checks=[['اطلاعات شیفت',!!Object.keys(sh).length],['ثبت بچ‌ها',db.batches.length>0],['نمونه‌گیری',db.samples.length>0],['خرابی‌ها',true],['موجودی رآکتورها',true],['اطلاعات آهک',db.limeRecords.length>0],['توضیحات شیفت',!!db.activityNote],['تحویل‌دهنده',!!db.handover?.giver?.confirmed],['تحویل‌گیرنده',!!db.handover?.receiver?.confirmed],['فعالیت‌های شیفت',a.clean!==undefined||a.blow!==undefined],['وسایل تحویلی',Object.keys(tools).length>0],['سرشیفت / سرپرست',!!(sh.head||sh.sup)]];return checks}
function archiveInfo(a){const sh=a?.shift||{};const n=v=>{const z=Number(faDigits(v));return z===1?'اول':z===2?'دوم':z===3?'سوم':''};const turn=String(sh.turn||'').trim();const ord=n(sh.shiftNo);return {shift:String(sh.shift||'').trim(),date:String(sh.date||a?.date||a?.registeredShiftDate||'').trim(),turn,ord}}
function archiveFileName(a){const x=archiveInfo(a);const shift=String(x.shift||'').trim();const date=String(x.date||'').trim();const turn=String(x.turn||'').trim();const ord=String(x.ord||'').trim();const parts=['Shift',shift,date,turn,ord].filter(Boolean);const name=parts.join(' ').replace(/[\/:*?"<>]+/g,'-').replace(/\s+/g,' ').trim()||'Shift Report';return name+'.pdf'}
function shareText(a){const x=archiveInfo(a),sh=a.shift||{},ops=[sh.op1,sh.op2].filter(Boolean).join(' ، ');return ['گزارش بچینگ آجر سیلیکان',`شیفت : ${x.shift}`,`تاریخ : ${x.date}`,`نوبت شیفتی : ${[x.turn,x.ord].filter(Boolean).join(' ')}`,ops?`اپراتور : ${ops}`:'',a.handover?.note?.trim()?`توضیحات :\n${a.handover.note.trim()}`:''].filter(Boolean).join('\n')}
function archiveNormalize(a){a.fileName=archiveFileName(a);a.pdfFileName=a.fileName;return a}
function allArchives(){db.finalArchives=Array.isArray(db.finalArchives)?db.finalArchives:[];if(!db.finalArchives.length&&db.lastFinalArchive?.id)db.finalArchives=[clone(db.lastFinalArchive)];db.finalArchives.forEach(archiveNormalize);return db.finalArchives}
function confirmFinal(){
  if(!db.handover?.giver?.confirmed||!db.handover?.receiver?.confirmed){
    toast('ابتدا تحویل‌دهنده و تحویل‌گیرنده را تایید کنید',false);return
  }
  const id=db.__editingArchiveId||'fa_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
  const old=allArchives().find(x=>String(x.id)===String(id));
  const a={id,registeredShiftDate:db.shift?.date||'',date:db.shift?.date||'',finalizedDate:today(),time:now(),
    createdAt:old?.createdAt||Date.now(),updatedAt:Date.now(),finalConfirmed:true,
    shift:clone(db.shift||{}),batches:clone(db.batches||[]),samples:clone(db.samples||[]),
    failures:clone(db.failures||[]),inventory:clone(db.inventory||[]),limeRecords:clone(db.limeRecords||[]),
    limeFormulaRanges:clone(db.limeFormulaRanges||[]),activityNote:db.activityNote||'',
    activities:clone(db.activities||{}),toolStatus:clone(db.toolStatus||{}),
    handover:clone(db.handover||{}),handoverHistory:clone(db.handoverHistory||[])};
  archiveNormalize(a);
  const i=db.finalArchives.findIndex(x=>String(x.id)===String(id));
  if(i>=0)db.finalArchives[i]=a;else db.finalArchives.unshift(a);
  db.lastFinalArchiveId=id;db.lastFinalArchive=clone(a);
  db.finalReport={confirmed:true,date:a.finalizedDate,time:a.time};
  // IMPORTANT: persist the final archive BEFORE clearing the working report.
  // If persistence fails, the working report remains untouched.
  try{
    save();
    const saved=JSON.parse(localStorage.getItem(KEY)||'null');
    const stored=saved?.finalArchives?.find(x=>String(x.id)===String(id));
    if(!stored || saved?.finalReport?.confirmed!==true) throw new Error('final archive verification failed');
  }catch(e){
    console.error(e);
    toast('ذخیره نهایی تایید نشد؛ اطلاعات فعلی پاک نشد',false);
    return;
  }
  db.shift=null;db.shiftHistory=[];db.batches=[];db.samples=[];db.failures=[];db.inventory=[];
  db.limeRecords=[];db.limeFormulaRanges=[];db.activityNote='';db.activities={};db.toolStatus={};
  db.handover={};db.activityHistory=[];db.__editingArchiveId=null;db.batchDraft=null;db.sampleDraftTime='';
  db.batchSchedule={enabled:false,interval:6,nextTime:''};
  try{save()}catch(e){console.error(e);toast('گزارش نهایی ثبت شد، اما پاک‌سازی فرم جدید انجام نشد',false);showPage('systemReport');return}
  showPage('systemReport');toast('گزارش نهایی ذخیره شد؛ فرم گزارش جدید آماده است')
}

async function makePDFBlob(a){const pages=await renderPDFPages(a);const enc=new TextEncoder(),parts=[],ofs=[0];let pos=0;const add=t=>{const b=enc.encode(t);parts.push(b);pos+=b.length},addB=b=>{parts.push(b);pos+=b.length};add('%PDF-1.4\n%REBUILD\n');const n=pages.length,firstPage=3,firstImg=3+n,firstCont=3+n+n,kids=[];for(let i=0;i<n;i++)kids.push(`${firstPage+i} 0 R`);function obj(id,body){ofs[id]=pos;add(`${id} 0 obj\n${body}\nendobj\n`)}obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${n} >>`);for(let i=0;i<n;i++)obj(firstPage+i,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im${i} ${firstImg+i} 0 R >> >> /Contents ${firstCont+i} 0 R >>`);for(let i=0;i<n;i++){const b=await new Promise((res,rej)=>pages[i].toBlob(x=>x?res(x):rej(new Error('canvas export failed')),'image/jpeg',1.0)),u=new Uint8Array(await b.arrayBuffer()),id=firstImg+i;ofs[id]=pos;add(`${id} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${pages[i].width} /Height ${pages[i].height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Interpolate false /Length ${u.length} >>\nstream\n`);addB(u);add('\nendstream\nendobj\n')}for(let i=0;i<n;i++){const content=`q\n595 0 0 842 0 0 cm\n/Im${i} Do\nQ\n`;obj(firstCont+i,`<< /Length ${enc.encode(content).length} >>\nstream\n${content}endstream`)}const total=firstCont+n,xref=pos;add(`xref\n0 ${total}\n0000000000 65535 f \n`);for(let i=1;i<total;i++)add(String(ofs[i]||0).padStart(10,'0')+' 00000 n \n');add(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);return new Blob(parts,{type:'application/pdf'})}
function busy(on,title='در حال ساخت PDF'){document.getElementById('loadingTitle').textContent=title;document.getElementById('loading').classList.toggle('show',on)}
function downloadBlobCompat(blob,name){const u=URL.createObjectURL(blob);try{const a=document.createElement('a');a.href=u;a.download=name;a.rel='noopener';a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),15000);return true}catch(e){console.error(e);try{const w=window.open(u,'_blank','noopener');if(w){setTimeout(()=>URL.revokeObjectURL(u),30000);return true}}catch(err){console.error(err)}try{window.location.href=u;setTimeout(()=>URL.revokeObjectURL(u),30000);return true}catch(err){console.error(err);URL.revokeObjectURL(u);return false}}}
async function downloadPDF(a){busy(true,'در حال ساخت و ذخیره PDF');try{const b=await makePDFBlob(a);if(window.AndroidBridge?.saveFile){const base64=await blobToBase64(b);window.AndroidBridge.saveFile(base64,archiveFileName(a),'application/pdf')}else if(!downloadBlobCompat(b,archiveFileName(a)))throw new Error('mobile download failed');toast('PDF با موفقیت آماده و ذخیره شد')}catch(e){console.error(e);toast('ذخیره PDF انجام نشد؛ دوباره تلاش کنید',false)}finally{busy(false)}}
async function blobToBase64(blob){
  const buf=await blob.arrayBuffer();
  let binary='';
  const bytes=new Uint8Array(buf);
  const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk)binary+=String.fromCharCode(...bytes.subarray(i,Math.min(i+chunk,bytes.length)));
  return btoa(binary);
}
async function sharePDF(a){
  busy(true,'در حال آماده‌سازی PDF برای اشتراک‌گذاری');
  try{
    const b=await makePDFBlob(a),name=archiveFileName(a);
    if(window.AndroidBridge?.shareFile){
      const base64=await blobToBase64(b);
      window.AndroidBridge.shareFile(base64,name,'application/pdf',shareText(a));
      toast('PDF برای اشتراک‌گذاری آماده شد');return;
    }
    const f=new File([b],name,{type:'application/pdf'});
    if(typeof navigator.share==='function'&&(!navigator.canShare||navigator.canShare({files:[f]}))){
      await navigator.share({title:'گزارش بچینگ آجر سیلیکان',text:shareText(a),files:[f]});
      toast('PDF با موفقیت برای اشتراک‌گذاری آماده شد')
    }else if(typeof navigator.share==='function'){
      await navigator.share({title:'گزارش بچینگ آجر سیلیکان',text:shareText(a)});
      toast('اشتراک‌گذاری متن انجام شد؛ فایل PDF هم آماده ارسال است')
    }else{
      if(!downloadBlobCompat(b,name))throw new Error('share fallback failed');
      toast('PDF ذخیره شد؛ آن را از فایل‌های گوشی ارسال کنید')
    }
  }catch(e){if(e.name!=='AbortError'){console.error(e);toast('اشتراک‌گذاری انجام نشد؛ PDF را از گزینه ذخیره امتحان کنید',false)}}
  finally{busy(false)}
}
async function previewPDF(a){
  busy(true,'در حال ساخت پیش‌نمایش');
  try{
    const pages=await renderPDFPages(a,1);
    if(!Array.isArray(pages)||!pages.length)throw new Error('PDF render returned no pages');
    const d=document.createElement('div');
    d.className='overlay';
    d.style.alignItems='stretch';
    d.innerHTML=`<div style="width:min(520px,100%);height:100%;overflow:auto;background:#eef1f4;padding:10px 10px calc(18px + env(safe-area-inset-bottom));"><div style="position:sticky;top:0;z-index:3;background:#fff;border:1px solid var(--border);border-radius:16px;padding:9px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b style="font-size:12px">پیش‌نمایش برگه گزارش</b><div style="display:flex;gap:6px"><button class="icon-btn" id="zoomOut">−</button><button class="icon-btn" id="zoomIn">＋</button><button class="icon-btn" id="closePrev">×</button></div></div><div id="previewPages" style="display:grid;gap:12px;transform-origin:top center"></div><div class="sheet-actions" style="position:sticky;bottom:0;background:rgba(238,241,244,.96);padding-top:8px"><button class="btn btn-primary" id="pDownload">${icon('pdf',16)} دانلود PDF</button><button class="btn btn-secondary" id="pShare">${icon('share',16)} اشتراک‌گذاری PDF</button></div></div>`;
    document.body.appendChild(d);
    d.querySelector('#closePrev').onclick=()=>d.remove();
    let zoom=1;
    const wrap=d.querySelector('#previewPages');
    pages.forEach((c,i)=>{
      // Keep the rendered PDF page as a canvas. Converting large canvases to PNG
      // data URLs can exceed memory limits in Android WebView and was the source
      // of the "preview not created" failure.
      c.setAttribute('aria-label','صفحه '+(i+1));
      c.style.cssText='width:100%;height:auto;display:block;background:#fff;border:1px solid #dfe3e8;border-radius:15px;box-shadow:0 8px 22px rgba(15,23,42,.12)';
      wrap.appendChild(c);
    });
    const apply=()=>{wrap.style.transform=`scale(${zoom})`;wrap.style.marginBottom=`${Math.max(0,(zoom-1)*900)}px`};
    d.querySelector('#zoomIn').onclick=()=>{zoom=Math.min(2.5,zoom+.25);apply()};
    d.querySelector('#zoomOut').onclick=()=>{zoom=Math.max(.75,zoom-.25);apply()};
    const blobPromise=makePDFBlob(a);
    d.querySelector('#pDownload').onclick=async()=>{busy(true);try{const b=await blobPromise;if(window.AndroidBridge?.saveFile){const base64=await blobToBase64(b);window.AndroidBridge.saveFile(base64,archiveFileName(a),'application/pdf')}else{const u=URL.createObjectURL(b),el=document.createElement('a');el.href=u;el.download=archiveFileName(a);document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(u),10000)}toast('فایل PDF برای ذخیره انتخاب شد')}finally{busy(false)}};
    d.querySelector('#pShare').onclick=async()=>{busy(true,'در حال آماده‌سازی اشتراک‌گذاری');try{const b=await blobPromise,name=archiveFileName(a);if(window.AndroidBridge?.shareFile){const base64=await blobToBase64(b);window.AndroidBridge.shareFile(base64,name,'application/pdf',shareText(a));toast('PDF برای اشتراک‌گذاری آماده شد')}else{const f=new File([b],name,{type:'application/pdf'});if(navigator.share&&navigator.canShare?.({files:[f]}))await navigator.share({title:'گزارش بچینگ آجر سیلیکان',text:shareText(a),files:[f]});else if(navigator.share)await navigator.share({title:'گزارش بچینگ آجر سیلیکان',text:shareText(a)});else toast('PDF ذخیره کنید و از فایل‌های گوشی ارسال کنید',false)}}catch(e){if(e.name!=='AbortError')toast('اشتراک‌گذاری انجام نشد',false)}finally{busy(false)}}
  }catch(e){console.error('PDF preview error:',e);toast('پیش‌نمایش PDF ساخته نشد',false)}
  finally{busy(false)}
}
